# Nginx 公网阻断 Agent API 示例配置
#
# 将以下 location 块加入生产 Nginx server 配置，
# 阻断公网对 Agent API、OpenAPI、Swagger UI 和非必要 Actuator 的访问。
# Agent API 只允许通过服务器回环或 Docker 私网访问。

server {
    listen 80;
    server_name your-domain.com;

    # ==================== 阻断 Agent API ====================
    location /api/v1/agent/ {
        deny all;
        return 404;
    }

    # ==================== 阻断 Agent OpenAPI ====================
    location /v3/api-docs/agent {
        deny all;
        return 404;
    }

    location /v3/api-docs {
        deny all;
        return 404;
    }

    # ==================== 阻断 Swagger UI ====================
    location /swagger-ui/ {
        deny all;
        return 404;
    }

    location /swagger-ui.html {
        deny all;
        return 404;
    }

    # ==================== 阻断非必要 Actuator ====================
    # 只保留 /actuator/health 给负载均衡探活
    location /actuator/ {
        # 允许 health
        location = /actuator/health {
            allow all;
        }
        # 其他 actuator 端点阻断
        deny all;
        return 404;
    }

    # ==================== 正常前端和业务 API ====================
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
